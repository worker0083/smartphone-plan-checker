<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スマホ料金診断</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --line: #e3e6eb; --accent: #2563eb; --accent-weak: #e8efff;
    --good: #15803d; --good-weak: #e7f6ec; --warn: #b45309; --warn-weak: #fdf3e3;
    --brand: #c2410c; --brand-weak: #fff1e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #9aa3b2;
      --line: #2c3340; --accent: #6b9bff; --accent-weak: #1f2b45;
      --good: #4ade80; --good-weak: #173322; --warn: #fbbf24; --warn-weak: #3a2e14;
      --brand: #fb923c; --brand-weak: #3a2414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  fieldset { border: 0; padding: 0; margin: 0 0 28px; }
  legend {
    font-size: 1.05rem; font-weight: 800; padding: 0 0 12px; width: 100%;
    display: flex; align-items: center; gap: 8px;
  }
  legend .num {
    display: inline-flex; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center;
    background: var(--accent); color: #fff; font-size: .85rem;
  }
  .q { margin-bottom: 18px; }
  .q > label, .q > .label { display: block; font-weight: 600; margin-bottom: 8px; }
  .hint { color: var(--muted); font-size: .82rem; font-weight: 400; }
  input[type=number], select {
    width: 100%; padding: 12px; font-size: 1rem; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips label {
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
    cursor: pointer; user-select: none; font-size: .95rem; background: var(--bg);
    display: inline-flex; align-items: center; -webkit-tap-highlight-color: transparent;
  }
  .chips input { display: none; }
  .chips label:has(input:checked) { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chips label, input[type=number], select, button { min-height: 44px; }
  button {
    width: 100%; padding: 14px; font-size: 1.05rem; font-weight: 700; border: 0;
    border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer;
  }

  /* 結果 */
  .hero { border: 2px solid var(--brand); background: var(--brand-weak); }
  .hero .tagline { font-size: .85rem; font-weight: 700; color: var(--brand); }
  .hero .title { font-size: 1.25rem; font-weight: 800; margin: 4px 0 2px; }
  .hero .items { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
  .hero .items span { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: .9rem; font-weight: 600; }
  .big { font-size: 2rem; font-weight: 800; color: var(--good); line-height: 1.2; }
  .big.bad { color: var(--warn); font-size: 1.4rem; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; margin-top: 12px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  thead th { color: var(--muted); font-weight: 600; font-size: .82rem; }
  tfoot td { font-weight: 800; border-bottom: 0; }
  .plus { color: var(--good); font-weight: 700; }
  .minus { color: var(--warn); font-weight: 700; }
  .plan { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .plan.rec { border-color: var(--brand); background: var(--brand-weak); }
  .plan-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .plan-name { font-weight: 700; }
  .price { font-weight: 800; white-space: nowrap; }
  .ex { color: var(--muted); font-size: .85rem; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; margin: 8px 0 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--muted); }
  .rec .bar > span { background: var(--brand); }
  .tag { display: inline-block; font-size: .75rem; padding: 1px 8px; border-radius: 6px; background: var(--brand); color: #fff; margin-left: 6px; vertical-align: 2px; }
  .breakdown { font-size: .82rem; color: var(--muted); margin-top: 2px; }
  .notice { font-size: .85rem; background: var(--warn-weak); color: var(--text); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .elec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .elec-box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
  .elec-box.rec { border-color: var(--brand); background: var(--brand-weak); }
  .elec-box .v { font-size: 1.3rem; font-weight: 800; }
  .disclaimer { color: var(--muted); font-size: .8rem; margin-top: 16px; }
  #result { display: none; }
  .placeholder { display: none; }

  /* タブレット（iPad mini 縦向き など） */
  @media (min-width: 700px) {
    main { max-width: 760px; padding: 32px 24px 64px; }
    h1 { font-size: 1.9rem; }
    .lead { font-size: 1.05rem; }
    .card { padding: 24px; border-radius: 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
    .grid .wide { grid-column: 1 / -1; }
    .chips label { padding: 10px 18px; font-size: 1rem; }
    .chips.fill { display: grid; grid-template-columns: repeat(3, 1fr); }
    .chips.fill label { justify-content: center; text-align: center; }
    .chips.fill.two { grid-template-columns: 1fr 1fr; }
    .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .plans .plan { margin-top: 0; }
    .big { font-size: 2.4rem; }
  }

  /* 横向き（iPad mini 横向き・PC）：入力と結果を左右に並べる */
  @media (min-width: 1000px) {
    main { max-width: 1120px; }
    .layout { display: grid; grid-template-columns: 440px 1fr; gap: 24px; align-items: start; }
    .layout > form { position: sticky; top: 16px; margin-bottom: 0; max-height: calc(100vh - 32px); overflow-y: auto; }
    .grid { grid-template-columns: 1fr; }
    #result { display: block; }
    #result.empty > :not(.placeholder) { display: none; }
    #result.empty .placeholder { display: flex; }
    .placeholder {
      min-height: 420px; align-items: center; justify-content: center; text-align: center;
      border: 2px dashed var(--line); border-radius: 18px; color: var(--muted); padding: 24px;
    }
  }
  .rank { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; align-items: center; justify-content: center;
    background: var(--line); color: var(--text); font-weight: 800; font-size: .9rem; margin-right: 8px; flex: none; }
  .plan.rec .rank { background: var(--brand); color: #fff; }
  .combo { list-style: none; padding: 0; margin: 8px 0 0; font-size: .9rem; }
  .combo li { padding: 2px 0; }
  .combo .ex { margin-left: 4px; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--accent); font-size: .85rem; }
  .carrier-head { display: flex; align-items: center; }
  .ranking { display: grid; gap: 10px; }
  @media (min-width: 700px) { .ranking { grid-template-columns: 1fr 1fr; } .ranking .plan { margin-top: 0; } }
  .ic { width: 1.15em; height: 1.15em; vertical-align: -0.2em; margin-right: 6px; color: var(--accent); flex: none; }
  h2 .ic { width: 1.25em; height: 1.25em; }
  .combo li { display: flex; align-items: baseline; flex-wrap: wrap; }
  .combo li .ic { align-self: center; color: var(--muted); }
  .rec .combo li .ic, .hero .combo li .ic { color: var(--brand); }
  .tag.now { background: var(--accent); }
  .plan.is-now { border-color: var(--accent); }
  .member { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--bg); }
  .member-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 8px; }
  .member-fields { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .member-fields label { font-size: .82rem; color: var(--muted); display: block; margin-bottom: 2px; }
  .member input, .member select { background: var(--card); }
  .remove { background: none; border: 0; color: var(--muted); font-size: .85rem; width: auto; min-height: 32px; padding: 4px 8px; cursor: pointer; }
  .sub-btn { background: var(--card); color: var(--accent); border: 1px dashed var(--accent); font-size: .95rem; }
  .sub-btn:disabled { opacity: .4; cursor: default; }
  @media (min-width: 700px) { .member-fields { grid-template-columns: 1fr 1fr; } }
  .scope { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .chips label.fixed { opacity: .7; cursor: default; }
  fieldset.off { display: none; }
  .who { font-weight: 700; margin-right: 4px; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .version { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .update-bar {
    display: none; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: var(--accent-weak); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: .92rem;
  }
  .update-bar.show { display: flex; }
  .promo { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--good-weak); font-size: .85rem; }
  .promo-title { font-weight: 700; color: var(--good); display: flex; align-items: center; }
  details.promo { margin-top: 8px; }
  details.promo summary.promo-title { cursor: pointer; display: list-item; }
  .promo-title .ic { color: var(--good); }
  .promo ul { list-style: none; padding: 0; margin: 4px 0 0; }
  .promo li { padding: 2px 0; }
  .promo .when { color: var(--muted); font-size: .8rem; }
  .ref { display: inline-block; font-size: .7rem; padding: 0 6px; border-radius: 5px; border: 1px solid var(--warn); color: var(--warn); margin-left: 4px; vertical-align: 1px; }
  .timeline { font-size: .82rem; margin-top: 4px; }
  .update-bar button { width: auto; padding: 8px 18px; min-height: 40px; font-size: .95rem; }
</style>
</head>
<body>
<main>
  <div id="updateBar" class="update-bar" role="status">
    <span id="updateText">新しいバージョンがあります</span>
    <button type="button" id="updateBtn">最新版に更新</button>
  </div>
  <div class="topbar">
    <h1>スマホ・ネット・でんき 料金診断</h1>
    <span class="version" id="version"></span>
  </div>
  <p class="lead">スマホ・自宅のインターネット・電気代をまとめて入力すると、各社ごとにいちばん安くなる組み合わせを計算して、家計全体で比べます（関西エリア向け）。</p>

  <div class="layout">
  <form id="form" class="card">
    <div class="q scope">
      <span class="label">比較する項目</span>
      <div class="chips fill">
        <label class="fixed"><input type="checkbox" checked disabled>スマホ</label>
        <label><input type="checkbox" id="useNet" checked>自宅ネット</label>
        <label><input type="checkbox" id="useElec" checked>でんき</label>
      </div>
      <span class="label" style="margin-top:14px">キャンペーン <span class="hint">（乗り換え・新規の特典）</span></span>
      <div class="chips fill two">
        <label><input type="radio" name="promo" value="yes" checked>含めて2年間で比べる</label>
        <label><input type="radio" name="promo" value="no">含めない（通常料金）</label>
      </div>
    </div>
    <fieldset>
      <legend><span class="num">1</span>スマホ</legend>
      <div class="grid">
        <div class="q wide">
          <span class="label">使う人ごとのスマホ代・データ量・通話 <span class="hint">（月額・税込）</span></span>
          <div id="members"></div>
          <button type="button" id="addMember" class="sub-btn">＋ 家族を追加</button>
        </div>
        <div class="q">
          <span class="label">各社のカード払い <span class="hint">（dカード・au PAYカード・PayPayカード）</span></span>
          <div class="chips fill two">
            <label><input type="radio" name="card" value="yes" checked>OK</label>
            <label><input type="radio" name="card" value="no">使わない</label>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset id="fsNet">
      <legend><span class="num">2</span>自宅のインターネット</legend>
      <div class="grid">
        <div class="q">
          <label for="netNow">今の回線</label>
          <select id="netNow">
            <option value="none">インターネット回線なし</option>
            <option value="eo">eo光</option>
            <option value="auhikari">auひかり</option>
            <option value="docomo" selected>ドコモ光</option>
            <option value="softbank">ソフトバンク光</option>
            <option value="nuro">NURO光</option>
            <option value="rakuten">楽天ひかり</option>
            <option value="other">その他（ケーブルTV・ホームルーターなど）</option>
          </select>
        </div>
        <div class="q">
          <label for="netFee">今のネット代 <span class="hint">（月額・税込）</span></label>
          <input id="netFee" type="number" inputmode="numeric" min="0" step="1" placeholder="例：5720">
        </div>
        <div class="q">
          <span class="label">お住まい</span>
          <div class="chips fill two">
            <label><input type="radio" name="house" value="home" checked>戸建て</label>
            <label><input type="radio" name="house" value="mansion">マンション</label>
          </div>
        </div>
        <div class="q">
          <span class="label">ネット回線の乗り換え</span>
          <div class="chips fill two">
            <label><input type="radio" name="netMove" value="yes" checked>検討する</label>
            <label><input type="radio" name="netMove" value="no">今のまま</label>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset id="fsElec">
      <legend><span class="num">3</span>でんき・ガス</legend>
      <div class="grid">
        <div class="q wide">
          <label for="elecNow">今の契約</label>
          <select id="elecNow">
            <option value="kepcoA" selected>関西電力 従量電灯A（電気だけ関電）</option>
            <option value="kepcoNattoku">関西電力 なっトクパック（電気もガスも関電）</option>
            <option value="audenki">auでんき</option>
            <option value="ouchidenki">おうちでんき（ソフトバンク）</option>
            <option value="docomodenki">ドコモでんき</option>
            <option value="rakutendenki">楽天でんき</option>
            <option value="other">その他の電力会社</option>
          </select>
        </div>
        <div class="q">
          <label for="elecBill">今の電気代 <span class="hint">（月額・税込）</span></label>
          <input id="elecBill" type="number" inputmode="numeric" min="0" step="1" placeholder="例：8000">
        </div>
        <div class="q">
          <label for="kwh">使用量 <span class="hint">（kWh・検針票にあれば）</span></label>
          <input id="kwh" type="number" inputmode="numeric" min="0" step="1" placeholder="例：260">
        </div>
        <div class="q wide">
          <span class="label">電力会社の切り替え</span>
          <div class="chips fill two">
            <label><input type="radio" name="elecMove" value="yes" checked>検討する</label>
            <label><input type="radio" name="elecMove" value="no">今のまま</label>
          </div>
        </div>
      </div>
    </fieldset>

    <button type="submit">診断する</button>
  </form>

  <section id="result" class="empty">
    <div class="placeholder">左の質問に答えて「診断する」を押すと、<br>ここに結果が表示されます。</div>
    <div class="card hero" id="hero"></div>
    <div class="card" id="ranking"></div>
    <div class="card" id="internet"></div>
    <div class="card" id="elec"></div>
    <p class="disclaimer" id="disclaimer"></p>
  </section>
  </div>
</main>

<script>
// ───── バージョン（更新するときは version.json と合わせて書き換える）─────
const APP_VERSION = "1.7.0";
const APP_DATE = "2026-11-14";
</script>
<script src="plans.js?v=1.7.0"></script>
<script>
const D = window.DATA;

// ───── 更新チェック：公開中の version.json と比べて、古ければ更新ボタンを出す ─────
document.getElementById("version").textContent = `v${APP_VERSION}（${APP_DATE.replace(/-/g, "/")} 更新）`;
const newer = (a, b) => { // a が b より新しいか
  const x = a.split(".").map(Number), y = b.split(".").map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); }
  return false;
};
let latest = null;
async function checkUpdate() {
  try {
    const r = await fetch(`version.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) return;
    const v = await r.json();
    if (v.version && newer(v.version, APP_VERSION)) {
      latest = v.version;
      document.getElementById("updateText").textContent = `新しいバージョン v${v.version} があります（今は v${APP_VERSION}）`;
      document.getElementById("updateBar").classList.add("show");
    }
  } catch (e) { /* オフライン等は何もしない */ }
}
document.getElementById("updateBtn").addEventListener("click", () => {
  // キャッシュを避けるため、URLに版番号を付けて読み込み直す
  const u = new URL(location.href);
  u.searchParams.set("v", latest || Date.now());
  location.replace(u.toString());
});
checkUpdate();
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
setInterval(checkUpdate, 10 * 60 * 1000);
const yen = n => (n < 0 ? "-" : "") + "¥" + Math.round(Math.abs(n)).toLocaleString("ja-JP");
const signed = n => n > 0 ? `<span class="plus">${yen(n)} おトク</span>` : n < 0 ? `<span class="minus">${yen(-n)} 高い</span>` : "変わらず";
const val = id => document.getElementById(id).value;
const radio = name => document.querySelector(`input[name=${name}]:checked`).value;
const svg = d => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC = {
  phone: svg('<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>'),
  net: svg('<path d="M2.5 9a14 14 0 0 1 19 0"/><path d="M5.5 12.5a9.5 9.5 0 0 1 13 0"/><path d="M8.7 16a5 5 0 0 1 6.6 0"/><circle cx="12" cy="19.5" r="1"/>'),
  elec: svg('<path d="M13 2.5 5 13.5h6l-1 8 8-11h-6z"/>'),
  gift: svg('<rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8.5h14V12M12 8v12.5M12 8S10.5 3.5 8 4.5 9 8 12 8zm0 0s1.5-4.5 4-3.5S15 8 12 8z"/>'),
  rank: svg('<path d="M4 20.5h16"/><rect x="5" y="12" width="4" height="8.5"/><rect x="10" y="7" width="4" height="13.5"/><rect x="15" y="14.5" width="4" height="6"/>'),
};
const gbText = gb => gb === Infinity ? "無制限" : gb + "GB";
const E = D.electricity;
const elecById = id => E.plans.find(p => p.id === id);
const netById = id => D.internet.find(n => n.id === id);

// ───── キャンペーン ─────
const H = 24; // キャンペーン込みで比べる期間（か月）
const TODAY = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
const livePromos = list => (list || []).filter(p => !p.until || p.until >= TODAY);
const promoValue = list => list.reduce((t, p) => t + (p.amt || 0) * Math.min(p.months || 0, H) + (p.once || 0), 0);
const dateText = d => d.replace(/-/g, "/");
// スマホ1回線ぶんのキャンペーン（今と同じキャリアなら対象外）
function linePromos(c, plan, tier, mem) {
  if (mem.carrierId === c.id) return [];
  return livePromos(plan.promos || c.promos)
    .filter(p => !(p.excludeFrom || []).includes(mem.carrierId))
    .map(p => {
      let amt = p.amt || 0;
      if (p.rate) amt = Math.floor(tier[1] * p.rate);
      if (p.byTier) amt = p.byTier[tier[0]] || 0;
      if (p.tiers && !p.tiers.includes(tier[0])) amt = 0;
      return { ...p, amt, who: mem.who };
    })
    .filter(p => p.amt > 0 || p.once > 0);
}

// ───── でんき ─────
function energyCharge(p, kwh) { // 最低料金＋電力量料金（税込）
  if (p.flat) return p.flat * kwh;
  let c = p.min, rest = Math.max(kwh - 15, 0);
  const bands = [105, 180, Infinity];
  for (let i = 0; i < 3 && rest > 0; i++) { const u = Math.min(rest, bands[i]); c += u * p.rates[i]; rest -= u; }
  return c;
}
const elecBill = (p, kwh) => Math.floor(energyCharge(p, kwh) + E.renewable * kwh);
function elecPoints(p, kwh) {
  if (!p.point) return { points: 0, rate: 0 };
  const base = energyCharge(p, kwh) / 1.1; // 税抜
  const rate = typeof p.point === "number" ? p.point : p.point.find(([lim]) => base < lim)[1];
  return { points: Math.ceil(base * rate), rate };
}
function kwhFromBill(p, bill) {
  let lo = 0, hi = 3000;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; elecBill(p, m) < bill ? lo = m : hi = m; }
  return Math.round(lo);
}

// ───── スマホ：1回線あたりの月額 ─────
function linePrice(c, plan, ctx, setNet, setDenki, mem) {
  const tier = plan.tiers.find(([g]) => g >= mem.need);
  if (!tier) return null;
  const parts = [`基本 ${yen(tier[1])}`];
  let cost = tier[1];
  // セット割
  let netAmt = 0, denkiAmt = 0;
  if (plan.set !== false) {
    if (setNet && c.net.per === "line") netAmt = plan.setAmt ?? c.net.amt;
    if (setDenki && c.denki.per === "line") denkiAmt = plan.denkiAmt ?? c.denki.amt;
  }
  let setLine = c.stack ? netAmt + denkiAmt : Math.max(netAmt, denkiAmt);
  // 家族割
  let fam = 0;
  if (plan.famFrom2nd && ctx.lines >= 2) fam = plan.famFrom2nd * (ctx.lines - 1) / ctx.lines;
  else if (ctx.lines >= 3) fam = plan.fam3 || 0;
  else if (ctx.lines === 2) fam = plan.fam2 || 0;
  if (!c.famWithSet && setLine > 0 && fam > 0) { if (fam > setLine) setLine = 0; else fam = 0; }
  if (setLine) { cost -= setLine; parts.push(`セット割 -${yen(setLine)}`); }
  if (fam) { cost -= fam; parts.push(`家族割 -${yen(fam)}${plan.famFrom2nd ? "（平均）" : ""}`); }
  if (ctx.card && c.card && plan.card !== false) { cost -= c.card; parts.push(`${c.cardName} -${yen(c.card)}`); }
  const add = mem.call === "short" ? plan.callShort : mem.call === "long" ? plan.callLong : 0;
  if (add) { cost += add; parts.push(`${mem.call === "short" ? "短時間かけ放題" : "かけ放題"} +${yen(add)}`); }
  cost = Math.max(cost, 0);
  const promos = linePromos(c, plan, tier, mem);
  return { plan: plan.name, gb: tier[0], cost, parts, promos, eff: cost - promoValue(promos) / H };
}

// ───── あるキャリアで、指定した人たちが一番安くなるプランを一人ずつ選ぶ ─────
function mobileFor(c, mems, ctx, setNet, setDenki) {
  const sub = { ...ctx, lines: mems.length }; // 家族割はそのキャリアの回線数で数える
  const out = mems.map(mem => {
    const opts = c.plans.map(p => linePrice(c, p, sub, setNet, setDenki, mem)).filter(Boolean);
    const key = o => ctx.promo ? o.eff : o.cost;
    return opts.length ? { who: mem.who, carrier: c.name, ...opts.sort((a, b) => key(a) - key(b))[0] } : null;
  });
  return out.some(x => !x) ? null : out;
}
function setExtras(c, setNet) {
  return {
    extra: setNet && c.net && c.net.extra ? c.net.extra : 0,
    homeDisc: setNet && c.net && c.net.per === "home" ? c.net.amt : 0,
    homeLabel: setNet && c.net && c.net.per === "home" ? c.net.label : "",
  };
}
const flags = (c, net, el) => ({
  setNet: !!(c.net && net.id && c.net.ids.includes(net.id)),
  setDenki: !!(c.denki && el.id === c.denki.id),
});

// 組み合わせのキャンペーンをまとめて、2年間の実質月額（score）を出す
function finish(r, ctx) {
  r.promos = [...r.members.flatMap(m => m.promos || []), ...(r.net.promos || []), ...(r.el.promos || [])];
  r.eff = r.total - promoValue(r.promos) / H;
  r.score = ctx.promo ? r.eff : r.total;
  return r;
}

// ───── 家族全員で1つのキャリアに乗り換える場合の最安（ネット × でんき × プラン）─────
function bestFor(c, ctx) {
  let best = null;
  for (const net of ctx.netOptions) for (const el of ctx.elecOptions) {
    const f = flags(c, net, el);
    const members = mobileFor(c, ctx.members, ctx, f.setNet, f.setDenki);
    if (!members) continue;
    const x = setExtras(c, f.setNet);
    const mobile = members.reduce((t, m) => t + m.cost, 0);
    const total = mobile + net.cost + x.extra + el.real - x.homeDisc;
    const r = finish({ name: c.name, ids: [c.id], members, net, netCost: net.cost + x.extra, extra: x.extra, el, homeDisc: x.homeDisc, homeLabel: x.homeLabel, total }, ctx);
    if (!best || r.score < best.score) best = r;
  }
  return best;
}

// ───── 家族それぞれ今のキャリアのまま、プランだけ見直す場合の最安 ─────
function stayFor(ctx) {
  const groups = {};
  ctx.members.forEach(m => (groups[m.carrierId] ||= []).push(m));
  let best = null;
  for (const net of ctx.netOptions) for (const el of ctx.elecOptions) {
    let total = net.cost + el.real, extra = 0, homeDisc = 0, labels = [], members = [], ok = true;
    for (const [id, mems] of Object.entries(groups)) {
      const c = D.carriers.find(x => x.id === id);
      if (!c) { // 一覧にない格安SIMは今の料金のまま
        mems.forEach(m => { members.push({ who: m.who, carrier: "今の格安SIM", plan: "今のプラン", gb: m.need, cost: m.current, parts: ["今の料金のまま"] }); total += m.current; });
        continue;
      }
      const f = flags(c, net, el);
      const ms = mobileFor(c, mems, ctx, f.setNet, f.setDenki);
      if (!ms) { ok = false; break; }
      const x = setExtras(c, f.setNet);
      extra = Math.max(extra, x.extra); homeDisc += x.homeDisc; if (x.homeLabel) labels.push(x.homeLabel);
      ms.forEach(m => { members.push(m); total += m.cost; });
    }
    if (!ok) continue;
    total += extra - homeDisc;
    members.sort((a, b) => ctx.members.findIndex(m => m.who === a.who) - ctx.members.findIndex(m => m.who === b.who));
    const r = finish({ name: "今のキャリアのまま", ids: Object.keys(groups), members, net, netCost: net.cost + extra, extra, el, homeDisc, homeLabel: labels.join("・"), total, stay: true }, ctx);
    if (!best || r.score < best.score) best = r;
  }
  return best;
}

      ${stay && !single ? card(stay, `<span class="plan-name">今のキャリアのまま見直し<span class="tag now">${nowName}</span></span>`, "is-now" + (topIsStay ? " rec" : "")) : ""}
      ${results.map((r, i) => card(r,
        `<span class="rank">${i + 1}</span><span class="plan-name">${r.name}${isNow(r) ? '<span class="tag now">今のキャリア</span>' : ""}</span>`,
        ((i === 0 && !topIsStay) || (isNow(r) && topIsStay) ? "rec " : "") + (isNow(r) ? "is-now" : ""))).join("")}
    </div>
    ${nowIds.length > 1 ? '<div class="ex" style="margin-top:8px">ランキングは家族みんなで同じ会社に乗り換えた場合です。</div>' : ""}`;

  document.getElementById("internet").style.display = useNet ? "" : "none";
  document.getElementById("elec").style.display = useElec ? "" : "none";

  // 自宅ネット
  const maxN = Math.max(...D.internet.map(n => n[house]), netCurrent, 1);
  const setNames = id => D.carriers.filter(c => c.net && c.net.ids.includes(id)).map(c => c.name).join("・");
  document.getElementById("internet").innerHTML = `
    <h2>${IC.net}自宅のインターネット（${house === "home" ? "戸建て" : "マンション"}・月額）</h2>
    <div class="ex">今：${netNow === "none" ? "回線なし" : yen(netCurrent)}</div>
    <div class="plans">${D.internet.map(n => {
      const cost = n.id === netNow && netFeeIn ? netFeeIn : n[house];
      const s = setNames(n.id);
      return `<div class="plan">
        <div class="plan-head"><span class="plan-name">${n.name}</span><span class="price">${yen(cost)}</span></div>
        <div class="ex">${s ? "セット割：" + s : "スマホのセット割なし"}${netNow !== "none" ? "・今と比べて 月 " + signed(netCurrent - cost) : ""}</div>
        <div class="bar"><span style="width:${Math.min(cost / maxN, 1) * 100}%"></span></div>
        <div class="breakdown">${n.note}</div>
        ${n.id !== netNow ? promoBox(netPromos(n).map(p => ({ ...p, who: "" }))) : ""}
      </div>`; }).join("")}</div>`;

  // でんき
  const maxE = Math.max(...elecRows.map(r => r.real), elecCurrent, 1);
  const denkiSet = id => D.carriers.filter(c => c.denki && c.denki.id === id).map(c => `${c.name} -${yen(c.denki.amt)}/回線`).join("・");
  document.getElementById("elec").innerHTML = `
    <h2>${IC.elec}でんき 切り替えシミュレーション（関西電力エリア）</h2>
    <div class="ex">月の使用量：約 ${kwh}kWh${kwhIn ? "" : billIn ? "（電気代から推定）" : "（目安）"}　／　今：${yen(elecCurrent)}</div>
    <div class="plans">${elecRows.sort((a, b) => a.real - b.real).map(r => `
      <div class="plan">
        <div class="plan-head"><span class="plan-name">${r.name}</span><span class="price">${yen(r.real)}</span></div>
        <div class="ex">電気代 ${yen(r.bill)}${r.points ? ` − ポイント ${r.points}pt（${(r.rate * 100).toFixed(1).replace(".0", "")}%）` : ""}・今と比べて 月 ${signed(elecCurrent - r.real)}</div>
        <div class="bar"><span style="width:${Math.min(r.real / maxE, 1) * 100}%"></span></div>
        <div class="breakdown">${denkiSet(r.id) ? "スマホのセット割：" + denkiSet(r.id) + "　" : ""}${r.note}</div>
        ${r.id !== elecNow ? promoBox(r.promos.map(p => ({ ...p, who: "" }))) : ""}
      </div>`).join("")}</div>
    ${elecNow === "kepcoNattoku" ? '<div class="notice">「なっトクパック」は電気とガスのセット割引が入っています。電気を他社に切り替えるとガスの契約条件が変わることがあるため、ガス料金は関西電力にご確認ください（この試算ではガス代は変わらない前提です）。</div>' : ""}
    <div class="notice">電気代は燃料費調整額（楽天でんきは市場価格調整額）を含めずに比べています。月によって実際の差は変わります。</div>`;

  document.getElementById("disclaimer").innerHTML =
    `※ 料金は${D.updated}時点で各社の公式サイトを確認した税込の目安です（一部は参考値）。端末代・工事費・事務手数料・解約金は含みません。` +
    `※ キャンペーンは${D.promoChecked}に確認した、各社の公式キャンペーン（月額割引・ポイント還元。1pt＝1円で計算）です。「参考」は公式で条件を確認できていない値です。代理店のキャッシュバックや端末割引は含みません。申込期限を過ぎたものは自動で外れます。乗り換え元のキャリアや申込窓口によって対象外になることがあります。` +
    `※ 本ツールは個人が作成した非公式の試算ツールで、特定の会社とは関係ありません。正式な料金は各社の公式サイト・店頭でご確認ください。`;

  const res = document.getElementById("result");
  res.classList.remove("empty");
  res.style.display = "block";
  if (window.innerWidth < 1000) res.scrollIntoView({ behavior: "smooth" });
});
</script>
</body>
</html>
